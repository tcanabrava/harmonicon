# The root package is now the *binary* only — every library lives under
# crates/. It keeps assets/, build.rs and tests/ so `cargo run`,
# `cargo build --bin harmonicon` and packaging are unchanged.
[package]
name = "harmonicon"
version = "0.0.11"
edition = "2024"
license = "MIT"
default-run = "harmonicon"
publish = false

# The root package is also the workspace root: members are added under
# crates/ as the pure-logic layers get extracted (see
# docs/physical_design_plan.md). Keeping the game itself here rather than
# moving it to crates/harmonicon means assets/, build.rs and tests/ all stay
# put, so the split lands one crate at a time instead of all at once.
[workspace]
members = ["crates/*"]
# Without this, a bare `cargo test` at the root selects only the root
# package — which is the binary and owns almost no tests — and cheerfully
# reports success having run ~3% of the suite. default-members makes the
# unqualified commands mean the whole workspace.
default-members = [".", "crates/*"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midly = "0.5"
bevy = { version = "0.19.1", features = ["wav"] }
cpal = "0.17"
rustfft = "6.4"
crossbeam-channel = "0.5"
rodio = { version = "0.22", default-features = false, features = ["vorbis"] }
bevy_fluent = "0.15.0"
fluent = "0.16"
fluent_content = "0.0.5"
unic-langid = "0.9"
sys-locale = "0.3"
figment = { version = "0.10", features = ["json"] }
dirs = "5"
thiserror = "2"
notify-debouncer-full = { version = "0.7", features = ["crossbeam-channel"] }
rand = "0.10"
pulldown-cmark = { version = "0.12", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
jsonschema = { version = "0.49", default-features = false }

# Shared by every member, so binaries and integration tests are held to the
# same set as each library.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
harmonicon-core = { path = "crates/harmonicon-core", version = "*"}
harmonicon-dsp = { path = "crates/harmonicon-dsp" }
harmonicon-audio = { path = "crates/harmonicon-audio", version = "*" }
harmonicon-platform = { path = "crates/harmonicon-platform", version = "*" }
harmonicon-song = { path = "crates/harmonicon-song", version = "*" }
harmonicon-app = { path = "crates/harmonicon-app", version = "*" }
harmonicon-ui = { path = "crates/harmonicon-ui", version = "*" }
harmonicon-gameplay = { path = "crates/harmonicon-gameplay", version = "*" }
harmonicon-jam = { path = "crates/harmonicon-jam", version = "*" }
harmonicon-editor = { path = "crates/harmonicon-editor", version = "*" }
harmonicon-menu = { path = "crates/harmonicon-menu", version = "*" }
harmonicon-lessons = { path = "crates/harmonicon-lessons", version = "*" }
harmonicon-bench = { path = "crates/harmonicon-bench", version = "*" }
# `wav` lets bevy_audio decode the in-memory WAV the song editor synthesises for
# its Play button (and user-supplied .wav background tracks).
bevy = { workspace = true }
cpal = { workspace = true }
rustfft = { workspace = true }
crossbeam-channel = { workspace = true }
# Audio decode for Song Editor tempo analysis (ogg via lewton; matches the
# version bevy_audio already pulls in, so no duplicate rodio).
rodio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
thiserror = { workspace = true }
midly = { workspace = true }
figment = { workspace = true }
dirs = { workspace = true }
# Window icon: winit must match Bevy's version; image decodes the PNG.
winit = "0.30"
image = { workspace = true }
bevy_fluent = { workspace = true }
# The `Content` trait used to resolve Fluent message keys; bevy_fluent builds on
# this same version but does not re-export the trait.
fluent_content = { workspace = true }
# `FluentArgs`, for native `{$name}` variable interpolation via `msg_args`;
# bevy_fluent builds on this same version but does not re-export it.
fluent = { workspace = true }
unic-langid = { workspace = true }
# Detect the OS UI language so the game starts in the player's locale.
sys-locale = { workspace = true }
regex = "1.13.1"
rand = { workspace = true }
clap = { version = "4.6.6", features = ["derive"] }
# Watches ~/Harmonicon (songs/, themes/) so drop-in content is picked up
# live instead of needing a manual refresh or restart. crossbeam-channel
# feature: bridges the watcher's background thread into ECS the same way
# audio_input.rs already bridges the mic capture thread.
notify-debouncer-full = { workspace = true }

[features]
# Local iteration: Bevy's dev tools + asset file watcher. Never ship it.
# Local dev: `cargo run --features dev`.
#
# Deliberately does *not* pull in dynamic_linking. That lives in its own
# feature below, because enabling it breaks `cargo test`: rustdoc's doctest
# binary cannot load the dynamically-linked stdlib
# ("libstd-*.so: cannot open shared object file"), so every doctest fails.
# Keeping the two apart means one command — `cargo test --features dev` —
# runs the whole suite, doctests included.
dev = [
    "bevy/dev",
    "bevy/debug",
    # The Bevy Remote Protocol, for driving a running game from outside
    # (screenshots, video capture, state inspection) — see src/dev_capture.rs
    # and contributing/src/remote-control.md. Native-only in bevy_internal, so enabling
    # it costs a wasm build nothing.
    "bevy/bevy_remote",
    "harmonicon-audio/dev",
    "harmonicon-platform/dev",
    "harmonicon-song/dev",
    "harmonicon-app/dev",
    "harmonicon-ui/dev",
    "harmonicon-gameplay/dev",
    "harmonicon-jam/dev",
    "harmonicon-editor/dev",
    "harmonicon-menu/dev",
    "harmonicon-lessons/dev",
]
# Dynamic-links Bevy for faster local link times. Opt in on top of `dev`
# when iterating on the game itself (`cargo run --features dev,dynamic_linking`);
# leave it off for `cargo test`, which cannot run doctests with it on, and
# never ship it — it needs libbevy_dylib*.so beside the binary, which
# packaged builds (e.g. the flatpak) don't bundle.
dynamic_linking = [
    "bevy/dynamic_linking",
    "harmonicon-audio/dynamic_linking",
    "harmonicon-platform/dynamic_linking",
    "harmonicon-song/dynamic_linking",
    "harmonicon-app/dynamic_linking",
    "harmonicon-ui/dynamic_linking",
    "harmonicon-gameplay/dynamic_linking",
    "harmonicon-jam/dynamic_linking",
    "harmonicon-editor/dynamic_linking",
    "harmonicon-menu/dynamic_linking",
    "harmonicon-lessons/dynamic_linking",
]
# Streams Bevy's built-in ECS/render/asset spans plus this crate's own
# manual spans (audio capture, pitch detection) to a running Tracy client
# (https://github.com/wolfpld/tracy — match its version against
# `cargo tree --features trace_tracy | grep tracy-client`, see
# https://github.com/nagisa/rust_tracy_client#version-support-table).
# `cargo run --release --features trace_tracy` with the Tracy UI already
# listening; see main.rs for the accompanying LogPlugin filter change this
# needs (spans below `info` are dropped before any backend sees them).
trace_tracy = ["bevy/trace_tracy", "harmonicon-audio/trace_tracy", "harmonicon-platform/trace_tracy", "harmonicon-song/trace_tracy", "harmonicon-app/trace_tracy", "harmonicon-ui/trace_tracy", "harmonicon-gameplay/trace_tracy", "harmonicon-jam/trace_tracy", "harmonicon-editor/trace_tracy", "harmonicon-menu/trace_tracy", "harmonicon-lessons/trace_tracy"]

[lints]
workspace = true

[[bin]]
name = "hole-editor"
path = "src/bin/hole_editor.rs"

[profile.dev]
opt-level = 1
# Enough debug info for a backtrace to name a file and line, without the
# full variable/type detail a step debugger wants. Measured below.
debug = "line-tables-only"
# Debug info stays in the object files instead of being copied into every
# binary that links them. Measured below.
split-debuginfo = "unpacked"

# Dependencies only — Cargo's `"*"` glob deliberately excludes workspace
# members, so this leaves our own crates fully debuggable.
[profile.dev.package."*"]
# Bevy is unusable at opt-level 0; this is what makes a debug build playable.
opt-level = 3
# ...and this is what stops it filling the disk. A debug `harmonicon` was
# 2.41 GB, of which 2.16 GB (90%) was `.debug_*` sections, almost all of it
# Bevy's. Stepping through Bevy's internals is not something this project
# does; stepping through *our* code still works, since the profile above
# doesn't apply to workspace members.
debug = false

# Two incompatible `getrandom` majors sit in the dependency tree at once —
# 0.4.x via `rand`/Bevy, 0.3.x via `ahash` — and each refuses to target
# wasm32 without an explicit opt-in, so both need enabling here even though
# neither is a direct dependency otherwise. The 0.3.x line additionally
# needs a compile-time cfg the Cargo feature alone doesn't cover — build
# (or `cargo check`) for wasm32 with:
#   RUSTFLAGS='--cfg getrandom_backend="wasm_js"' cargo build --target wasm32-unknown-unknown
# (not set globally here since RUSTFLAGS isn't expressible from Cargo.toml
# itself, and `.cargo/config.toml` is this repo's per-machine, gitignored
# local build config, not something to ship a project-wide setting through).
# blake3 (via bevy's asset hashing) builds a C SIMD backend by default,
# which needs the NDK's clang. Its pure-Rust path is slower but needs no C
# toolchain, so an Android build can be *checked* without one. Scoped to
# the target so desktop keeps the fast path.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
# Reads the bundled fonts' cmaps in tests/glyph_coverage.rs, so "does this
# character actually render" is decided by the font binary rather than by a
# hand-maintained list. Already in the lock via bevy's text stack, so it adds
# nothing to build.
#
# Deliberately not `ttf-parser`, which does the same job and was used here
# first: its author has declared it unmaintained (RUSTSEC-2026-0192). It
# remains in the lock regardless — Bevy reaches it via winit/ab_glyph — but
# `deny.toml` sets `unmaintained = "workspace"`, which exempts a transitive
# crate and flags one this workspace names directly. Naming it here turned
# Bevy's problem into ours and failed `cargo deny`.
skrifa = "0.44"

# Switches on the shared MIDI test constructors; see harmonicon-core's Cargo.toml.
harmonicon-core = { path = "crates/harmonicon-core", features = ["test-support"] }
