[package]
name = "harmonicon-editor"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
harmonicon-core = { path = "../harmonicon-core", version = "*" }
harmonicon-score = { path = "../harmonicon-score", version = "*" }
harmonicon-audio = { path = "../harmonicon-audio", version = "*" }
harmonicon-platform = { path = "../harmonicon-platform", version = "*" }
harmonicon-song = { path = "../harmonicon-song", version = "*" }
harmonicon-app = { path = "../harmonicon-app", version = "*" }
harmonicon-ui = { path = "../harmonicon-ui", version = "*" }
harmonicon-gameplay = { path = "../harmonicon-gameplay", version = "*" }
bevy = { workspace = true }
serde_json = { workspace = true }
midly = { workspace = true }
jsonschema = { workspace = true }
dirs = { workspace = true }

[features]
dev = ["bevy/dev", "bevy/debug", "harmonicon-gameplay/dev"]
dynamic_linking = ["bevy/dynamic_linking", "harmonicon-gameplay/dynamic_linking"]
trace_tracy = ["bevy/trace_tracy", "harmonicon-gameplay/trace_tracy"]

[lints]
workspace = true

[dev-dependencies]
# midi_import's tests build SMF fixtures with core's shared constructors,
# which are feature-gated (see harmonicon-core's Cargo.toml). The root
# package enabling it is not enough — `cargo test -p harmonicon-editor`
# resolves this crate's own dev-dependencies, not the root's.
harmonicon-core = { path = "../harmonicon-core", features = ["test-support"] }
