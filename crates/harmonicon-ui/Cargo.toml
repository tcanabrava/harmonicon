[package]
name = "harmonicon-ui"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Only referenced from [features], to forward `dev`/`trace_tracy` to it;
# cargo-machete reads source, not features.
[package.metadata.cargo-machete]
ignored = ["harmonicon-song"]

[dependencies]
harmonicon-core = { path = "../harmonicon-core", version = "*" }
harmonicon-audio = { path = "../harmonicon-audio", version = "*" }
harmonicon-platform = { path = "../harmonicon-platform", version = "*" }
harmonicon-song = { path = "../harmonicon-song", version = "*" }
harmonicon-app = { path = "../harmonicon-app", version = "*" }
dirs = { workspace = true }
bevy = { workspace = true }

[features]
dev = ["bevy/dev", "bevy/debug", "harmonicon-platform/dev", "harmonicon-song/dev"]
dynamic_linking = ["bevy/dynamic_linking", "harmonicon-platform/dynamic_linking", "harmonicon-song/dynamic_linking"]
trace_tracy = ["bevy/trace_tracy", "harmonicon-platform/trace_tracy", "harmonicon-song/trace_tracy"]

[lints]
workspace = true

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "notation"
harness = false
