[package]
name = "harmonicon-gameplay"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
harmonicon-core = { path = "../harmonicon-core", version = "*" }
harmonicon-audio = { path = "../harmonicon-audio", version = "*" }
harmonicon-platform = { path = "../harmonicon-platform", version = "*" }
harmonicon-song = { path = "../harmonicon-song", version = "*" }
harmonicon-app = { path = "../harmonicon-app", version = "*" }
harmonicon-ui = { path = "../harmonicon-ui", version = "*" }
bevy = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "note_ribbons"
harness = false

[[bench]]
name = "adaptive_rebuild"
harness = false

[[bench]]
name = "judge"
harness = false

[features]
dev = ["bevy/dev", "bevy/debug", "harmonicon-ui/dev", "harmonicon-song/dev"]
dynamic_linking = ["bevy/dynamic_linking", "harmonicon-ui/dynamic_linking", "harmonicon-song/dynamic_linking"]
trace_tracy = ["bevy/trace_tracy", "harmonicon-ui/trace_tracy", "harmonicon-song/trace_tracy"]

[lints]
workspace = true
