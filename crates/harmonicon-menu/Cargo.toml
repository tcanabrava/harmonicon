[package]
name = "harmonicon-menu"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Only referenced from [features], to forward `dev`/`trace_tracy` to it;
# cargo-machete reads source, not features.
[package.metadata.cargo-machete]
ignored = ["harmonicon-gameplay"]

[dependencies]
harmonicon-core = { path = "../harmonicon-core", version = "*" }
harmonicon-audio = { path = "../harmonicon-audio", version = "*" }
harmonicon-platform = { path = "../harmonicon-platform", version = "*" }
harmonicon-packs = { path = "../harmonicon-packs", version = "*" }
harmonicon-song = { path = "../harmonicon-song", version = "*" }
harmonicon-app = { path = "../harmonicon-app", version = "*" }
harmonicon-ui = { path = "../harmonicon-ui", version = "*" }
harmonicon-gameplay = { path = "../harmonicon-gameplay", version = "*" }
harmonicon-jam = { path = "../harmonicon-jam", version = "*" }
harmonicon-editor = { path = "../harmonicon-editor", version = "*" }
bevy = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
pulldown-cmark = { workspace = true }

[features]
dev = ["bevy/dev", "bevy/debug", "harmonicon-gameplay/dev"]
dynamic_linking = ["bevy/dynamic_linking", "harmonicon-gameplay/dynamic_linking"]
trace_tracy = ["bevy/trace_tracy", "harmonicon-gameplay/trace_tracy"]

[lints]
workspace = true
