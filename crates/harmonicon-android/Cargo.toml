# The Android artifact: a shared library exporting `android_main`, which is
# what the platform loads and calls instead of running a `main`.
#
# Its dependency on the game is target-gated, and everything in `src/lib.rs`
# is `#[cfg(target_os = "android")]`, so on every other target this builds as
# an *empty* cdylib with no dependencies — which links in milliseconds. That
# matters because the workspace's `default-members` glob includes this crate,
# so a plain `cargo build`/`cargo test` on desktop builds it too; without the
# gate, every desktop build would link the entire Bevy app a second time.
#
# Packaging is Gradle's job, not Cargo's — see `packaging/android/`. There is
# deliberately no `[package.metadata.android]` block here: that belongs to
# `cargo-apk`, which is deprecated and cannot emit a Play Store AAB.
[package]
name = "harmonicon-android"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
# `cargo ndk` builds this into `lib<name>.so`, which the manifest's
# `android.app.lib_name` meta-data names as `harmonicon_android`.
crate-type = ["cdylib"]

# The Android-only feature selections live *here*, on the crate that is
# actually the Android build target, so `cargo ndk -p harmonicon-android`
# works. They used to sit on the root package, which meant any `-p` build
# silently dropped them and broke feature unification.
[target.'cfg(target_os = "android")'.dependencies]
harmonicon = { path = "../..", version = "*" }
# Bevy 0.19's defaults are only 2d/3d/ui/audio — no activity backend — and
# `android-activity` hard-errors at compile time unless exactly one is
# chosen. GameActivity over NativeActivity for its far better soft-keyboard
# and IME handling, which the Song Editor's text fields need. It compiles
# GameActivity.cpp from the NDK, so unlike NativeActivity this makes an NDK
# a hard requirement for even `cargo check` on this target.
bevy = { workspace = true, features = ["android-game-activity"] }
# Content packs download over https; on Android, reqwest's certificate
# verifier (rustls-platform-verifier, through harmonicon-packs) must be handed
# the JVM and app context before the first connection — `android_main` does.
# Same versions harmonicon-packs' reqwest already pulls in, so nothing new is
# built.
rustls-platform-verifier = "0.7"
jni = { version = "0.22", default-features = false }

[features]
# Forwarded to the game exactly as every other crate forwards them, so
# feature unification doesn't end up with two differently-configured Bevy
# builds in one tree (root CLAUDE.md, "A new crate must forward...").
dev = ["harmonicon/dev"]
trace_tracy = ["harmonicon/trace_tracy"]
