[package]
name = "harmonicon-audio"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Microphone capture and pitch detection. Sits directly above
# harmonicon-core (which owns the pure pitch/MIDI maths) and below
# everything else — it knows nothing about songs, scoring or UI.
[dependencies]
harmonicon-core = { path = "../harmonicon-core" }
harmonicon-dsp = { path = "../harmonicon-dsp" }
bevy = { workspace = true }
cpal = { workspace = true }
crossbeam-channel = { workspace = true }
rodio = { workspace = true }

# Reading `RECORD_AUDIO`'s state means calling into the Java Activity, so this
# is only pulled in where that Activity exists. The VM/Activity pointers come
# from bevy's `ANDROID_APP`, not from `ndk-context` — see permission.rs for
# why that distinction matters.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[features]
dev = ["bevy/dev", "bevy/debug"]
dynamic_linking = ["bevy/dynamic_linking"]
trace_tracy = ["bevy/trace_tracy"]

[lints]
workspace = true

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "waveform"
harness = false
