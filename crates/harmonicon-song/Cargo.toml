[package]
name = "harmonicon-song"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
harmonicon-core = { path = "../harmonicon-core", version = "*" }
harmonicon-score = { path = "../harmonicon-score", version = "*" }
harmonicon-audio = { path = "../harmonicon-audio", version = "*" }
harmonicon-platform = { path = "../harmonicon-platform", version = "*" }
harmonicon-packs = { path = "../harmonicon-packs", version = "*" }
bevy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
# Parses lesson packs' translations in `lessons::validate`, so a syntax
# error fails the pack's CI instead of silently dropping messages.
fluent-syntax = "0.11"
unic-langid = { workspace = true }
midly = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }

[features]
dev = ["bevy/dev", "bevy/debug", "harmonicon-audio/dev", "harmonicon-platform/dev"]
dynamic_linking = ["bevy/dynamic_linking", "harmonicon-audio/dynamic_linking", "harmonicon-platform/dynamic_linking"]
trace_tracy = ["bevy/trace_tracy", "harmonicon-audio/trace_tracy", "harmonicon-platform/trace_tracy"]

[lints]
workspace = true

[dev-dependencies]
# The shared MIDI event constructors, so tests can build real files rather
# than checking in fixtures — same reason harmonicon-score enables them.
harmonicon-core = { path = "../harmonicon-core", features = ["test-support"] }
criterion = { workspace = true }
tempfile = "3"

[[bench]]
name = "chart_validation"
harness = false
