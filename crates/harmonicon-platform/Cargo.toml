[package]
name = "harmonicon-platform"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
harmonicon-core = { path = "../harmonicon-core", version = "*" }
harmonicon-score = { path = "../harmonicon-score", version = "*" }
harmonicon-audio = { path = "../harmonicon-audio", version = "*" }
harmonicon-packs = { path = "../harmonicon-packs", version = "*" }
bevy = { workspace = true }
# The Fluent stack, used directly: `localization::ftl` owns the `.ftl`/
# `.ftl.ron` asset loaders and `localization::Locale` the negotiation, so
# there is no `bevy_fluent` between this crate and Fluent itself. See
# LICENSE-bevy_fluent — that crate is where the asset layer came from.
fluent = { workspace = true }
fluent_content = { workspace = true }
fluent-langneg = { workspace = true }
intl-memoizer = { workspace = true }
unic-langid = { workspace = true }
ron = { workspace = true }
sys-locale = { workspace = true }
figment = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
crossbeam-channel = { workspace = true }
notify-debouncer-full = { workspace = true }
web-time = { workspace = true }

# The build script generates the bundled-asset manifest, and has to mirror
# `assets_management`'s discovery rules exactly — including *which* score
# formats count as a song's chart. Depending on the same crate the runtime
# scan reads `IMPORT_EXTENSIONS` from is what keeps the two from drifting.
[build-dependencies]
harmonicon-score = { path = "../harmonicon-score", version = "*" }

[dev-dependencies]
semver = "1"
tempfile = "3"

[features]
dev = ["bevy/dev", "bevy/debug", "harmonicon-audio/dev"]
dynamic_linking = ["bevy/dynamic_linking", "harmonicon-audio/dynamic_linking"]
trace_tracy = ["bevy/trace_tracy", "harmonicon-audio/trace_tracy"]

[lints]
workspace = true
