# SPDX-License-Identifier: MIT
#
# cargo-deny configuration, for `cargo deny check` in CI.
#
# Without a config the tool rejects every license and is unusable. The game
# is MIT and the tree is otherwise a permissive-licensed Bevy stack, so the
# point of the check is to catch a new dependency that isn't.

[licenses]
# Permissive licenses, plus MPL-2.0: its copyleft is per-file and the
# crates carrying it (symphonia's decoders, option-ext) ship unmodified.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # bzip2's own licence, on the pure-Rust libbz2-rs-sys. A permissive
    # BSD-style licence in all but name; it reaches us through zip, which
    # `guitarpro` uses for the zipped score containers (GPX, GP7, MuseScore).
    "bzip2-1.0.6",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[advisories]
# Only an unmaintained crate this repository actually depends on is
# actionable; a transitive one (ttf-parser, via Bevy's text stack) is
# Bevy's call to make, and failing every build over it would train people
# to ignore the check.
unmaintained = "workspace"

[bans]
# Duplicate versions are the norm in a Bevy tree, several dozen of them and
# none ours to fix, so this only warns.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true 

[graph]
exclude-unpublished = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
